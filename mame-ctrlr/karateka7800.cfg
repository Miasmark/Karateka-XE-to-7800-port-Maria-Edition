<?xml version="1.0"?>
<!--
  The keys for recording the 7800 port (Record Karateka 7800.bat passes
  -ctrlrpath mame-ctrlr -ctrlr karateka7800). Button 2 (the kick) is Space
  or Left Shift, not MAME's Left Alt: in a window, Windows takes a lone Alt
  tap for the window's menu, and the keys stop reaching MAME until the next
  tap (FINDINGS "The hardware test, round 2": the kick button "locking up").
  Button 1 (the punch) stays Left Ctrl. A recording stores the buttons, not
  the keys, so recordings play back the same.
-->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_BUTTON2">
                <newseq type="standard">KEYCODE_SPACE OR KEYCODE_LSHIFT</newseq>
            </port>
        </input>
    </system>
</mameconfig>
